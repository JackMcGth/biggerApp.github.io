<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyric Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Lyric Finder</h1>
    <p class="lede">Type the lyrics you remember. We'll search the iTunes library for songs that might match.</p>

    <form id="search-form">
      <label for="lyrics" class="sr-only">Lyrics</label>
      <textarea id="lyrics" rows="4" placeholder="e.g. is this the real life, is this just fantasy" required></textarea>
      <button type="submit" id="go">Find songs</button>
    </form>

    <p class="note">The iTunes Search API matches song titles, artists and albums, not full lyrics. Phrases from a title or chorus hook work best.</p>

    <p id="status" role="status" aria-live="polite"></p>
    <ol id="results"></ol>
  </main>
  <script src="app.js"></script>
</body>
</html>
